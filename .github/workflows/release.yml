name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Set app version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Expected a vMAJOR.MINOR.PATCH tag" >&2
            exit 1
          fi
          release_version="${BASH_REMATCH[1]}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $release_version" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $release_version" Resources/Info.plist
      - run: just test
      - run: just build
      - run: just check-config
      - name: Archive app and CLI
        shell: bash
        run: |
          archive="dist/HocusFocus-${GITHUB_REF_NAME}-macos-$(uname -m).zip"
          staging="$(mktemp -d)"
          cp -R dist/HocusFocus.app "$staging/"
          cp dist/hocusfocus LICENSE "$staging/"
          ditto -c -k --sequesterRsrc "$staging" "$archive"
          rm -rf "$staging"
      - name: Generate release notes
        id: changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: latest
          args: --current --strip header
        env:
          OUTPUT: ${{ runner.temp }}/hocusfocus-changes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG_FILE: ${{ steps.changelog.outputs.changelog }}
        shell: bash
        run: |
          notes="$(mktemp)"
          cat "$CHANGELOG_FILE" > "$notes"
          cat >> "$notes" <<'NOTES'

          ## Installation

          Native macOS app and CLI, built for the architecture named in the archive.

          Download and unzip the archive for your Mac. Move HocusFocus.app to
          /Applications, open it, and enable HocusFocus in System Settings →
          Privacy & Security → Accessibility. Preferences live in the menu bar.

          This build is ad-hoc signed and is not notarized.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/HocusFocus-*.zip --verify-tag --notes-file "$notes"
          rm -f "$notes"
